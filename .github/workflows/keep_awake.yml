name: Keep WealthPy Labs Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WealthPy Labs
        run: |
          response=$(curl -L --max-time 120 -s -o /dev/null -w "%{http_code}" https://wealthos-d68kgrqlgk2qzssgxwccuh.streamlit.app)
          echo "HTTP Status: $response"
          if [ "$response" = "200" ]; then
            echo "App is awake and running!"
          else
            echo "App returned status $response - may be waking up"
          fi
